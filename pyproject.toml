[project]
name = "mbench"
version = "1.3.0"
description = "Benchmark the local LLMs behind llama-swap and rank them on one leaderboard."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "guitaripod" }]
keywords = ["llm", "benchmark", "leaderboard", "llama-swap", "llama.cpp", "sglang", "local-llm"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.40",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "tokenizers>=0.19",
  "huggingface_hub>=0.24",
  "pyyaml>=6",
  "math-verify>=0.9",
]

[project.urls]
Homepage = "https://github.com/guitaripod/mbench"
Issues = "https://github.com/guitaripod/mbench/issues"

[project.scripts]
mbench = "mbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbench"]
