<style>
:root {
  color-scheme: light dark;
  --page: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --border: rgba(11, 11, 11, 0.12);
  --ui: "Atkinson Hyperlegible Next", system-ui, -apple-system, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7; --border: rgba(255, 255, 255, 0.14); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--ui); }
main { max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; display: grid; gap: 1rem; }
h1 { font-family: "Archivo", var(--ui); font-size: 1.25rem; margin: 0; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
label { font-size: 0.8rem; color: var(--ink-2); display: grid; gap: 0.2rem; }
label[hidden] { display: none; }
select:disabled, option:disabled { color: var(--muted); }
select, button { font: inherit; font-size: 0.85rem; padding: 0.35rem 0.5rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--page); color: var(--ink); }
button { cursor: pointer; font-weight: 600; }
button:hover { border-color: var(--ink-2); }
canvas { width: 100%; max-width: 1200px; aspect-ratio: 1200 / 675; border: 1px solid var(--border); border-radius: 8px; }
.picks { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.picks[hidden] { display: none; }
.picks button { font: inherit; font-size: 0.78rem; padding: 0.2rem 0.6rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--page); color: var(--muted); }
.picks button[aria-pressed="true"] { color: var(--ink); border-color: currentColor; font-weight: 600; }
.picks button:disabled { cursor: default; opacity: 0.55; }
.hint { font-size: 0.8rem; color: var(--ink-2); margin: 0; max-width: 78ch; line-height: 1.5; }
.hint .dim { color: var(--muted); }
body.bare { background: none; }
body.bare main { max-width: none; margin: 0; padding: 0; gap: 0; }
body.bare .controls, body.bare h1, body.bare .hint, body.bare .picks { display: none; }
body.bare canvas { width: 1200px; border: 0; border-radius: 0; }
</style>
</head>

    <label id="only-label">Model<select id="only"></select></label>
    <label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <button id="download" type="button">Download PNG</button>
  </div>
  <div class="picks" id="picks" hidden></div>
  <canvas id="card" width="2400" height="1350"></canvas>
  <p class="hint" id="hint"></p>
</main>

    const colour = entry.tied ? "tie" : entry.delta > 0 ? "a" : "b";
    const x = entry.delta > 0 ? axis - width - 1 : axis + 1;
    box(x, y + 3, width, 14, colour, 4);
    const label = (entry.delta > 0 ? "+" : "−") + Math.abs(entry.delta).toFixed(1) + (entry.tied ? "  tied" : "");
    const inside = width > 96 && !entry.tied;
    const at = entry.delta > 0 ? (inside ? x + 10 : x - 8) : (inside ? x + width - 10 : x + width + 8);
    text(label, at, y + 15, { size: 14, family: "mono",
      color: inside && !entry.tied ? "page" : entry.tied ? "muted" : "ink2",
      align: entry.delta > 0 ? (inside ? "left" : "right") : (inside ? "right" : "left") });
    text(pair(entry.one, entry.two), W - 56, y + 15, { size: 13, family: "mono", color: "muted", align: "right" });
  });
  return top + deltas.length * step;
}

function pair(one, two) {
  const show = entry => entry && entry.value != null ? entry.value.toFixed(1) : "–";
  return `${show(one)} / ${show(two)}`;
}

function strip(left, right, y) {
  const phones = classOf(left) === "phone";
  const all = phones ? [
    ["Decode once hot", model => model.speed.decode_steady, value => Math.round(value) + " tok/s", "high"],
    ["Tokens at full speed", model => model.speed.tokens_to_knee, value => Math.round(value) + " tok", "high"],
    ["Battery an hour costs", model => model.battery && model.battery.per_hour, value => Math.round(value) + "%", "low"],
  ] : [
    ["Decode, one request", model => model.speed.decode, value => Math.round(value) + " tok/s", "high"],
    ["Peak, all requests", model => model.speed.peak, value => Math.round(value) + " tok/s", "high"],
    ["Energy per correct answer", model => (model.energy || {}).perCorrect, value => value.toFixed(2) + " Wh", "low"],
  ];
  const items = all.filter(([, pick]) => pick(left) || pick(right));
  if (!items.length) return;
  const width = (W - 112) / items.length;
  items.forEach(([label, pick, format, better], index) => {
    const x = 56 + index * width;
    text(label + (better === "low" ? "  (lower is better)" : ""), x, y + 22, { size: 13, family: "mono", color: "muted" });
    const one = pick(left), two = pick(right);
    const ahead = one && two ? (better === "low" ? one.value < two.value : one.value > two.value) : null;
    dot(x + 5, y + 44, "a");
    text(one ? format(one.value) : "–", x + 18, y + 49, { size: 20, weight: 600, family: "display", color: ahead === true ? "ink" : "ink2" });
    dot(x + 5, y + 70, "b");
    text(two ? format(two.value) : "–", x + 18, y + 75, { size: 20, weight: 600, family: "display", color: ahead === false ? "ink" : "ink2" });
  });
}

function chosen() {
  /* What the card draws: the models named, in the order the ranking puts them, topped up from the ranking when the
     link named fewer than the mode needs. */
  const list = pool();
  const named = state.models.map(id => list.find(model => model.id === id)).filter(Boolean);
  const rest = list.filter(model => !named.includes(model));
  const want = state.mode === "many" ? Math.max(NEEDS.many, named.length) : NEEDS[state.mode];
  return [...named, ...rest].slice(0, Math.min(want, list.length));
}

function chrome(models) {
  text("mbench", 56, 62, { size: 24, weight: 700, family: "display" });
  const first = models[0] || {};
  const where = classOf(first) === "phone" ? ((first.stack || {}).device || "a phone")
    : (first.stack && first.stack.gpu ? first.stack.gpu.replace("NVIDIA ", "") : "one GPU");
  text(`suite ${DATA.suite || "full"} · ${state.effort} effort · ${where}`, W - 56, 62,
    { size: 14, family: "mono", color: "muted", align: "right" });
  box(56, 84, W - 112, 1, "grid");
  const newest = Math.max(...models.map(model => (model.run || {}).finished || 0));
  const when = newest > 0 ? new Date(newest * 1000)
    .toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  text("guitaripod.github.io/mbench", 56, H - 28, { size: 13, family: "mono", color: "muted" });
  return when;
}

const PHONE_COLUMNS = [
  ["settled", model => (model.speed.decode_steady || {}).value, value => Math.round(value) + " tok/s"],
  ["cold", model => (model.speed.decode_peak || {}).value, value => Math.round(value) + " tok/s"],
  ["holds", model => (model.speed.stability || {}).value, value => Math.round(value) + "%"],
  ["peak RAM", model => (model.speed.footprint || {}).value, value => (value / 1024).toFixed(1) + " GB"],
];

const GPU_COLUMNS = [
  ["decode", model => (model.speed.decode || {}).value, value => Math.round(value) + " tok/s"],
  ["peak", model => (model.speed.peak || {}).value, value => Math.round(value) + " tok/s"],
  ["Wh/correct", model => ((model.energy || {}).perCorrect || {}).value, value => value.toFixed(2)],
];

function measures(list) {
  const columns = classOf(list[0]) === "phone" ? PHONE_COLUMNS : GPU_COLUMNS;
  return columns.filter(([, read]) => list.some(model => read(model) != null));
}

function drawMany(list) {
  /* A ranked card: the models the link named, in order, each with what it scored and what that cost the device.
     The bar carries the ranking at a glance; the per-question numbers are the single-model card's job. */
  const when = chrome(list);
  const columns = measures(list);
  const gap = 132, firstX = W - 56 - (columns.length - 1) * gap;
  const indexX = 500, barStart = indexX + 22, barEnd = firstX - 112;
  const best = Math.max(1, ...list.map(model => (model.index || {}).value || 0));
  const top = 152, rowHeight = (H - top - 78) / list.length;
  text("model", 92, top - 20, { size: 13, family: "mono", color: "muted" });
  text("quality", indexX, top - 20, { size: 13, family: "mono", color: "muted", align: "right" });
  columns.forEach(([name], column) => text(name, firstX + column * gap, top - 20,
    { size: 13, family: "mono", color: "muted", align: "right" }));
  list.forEach((model, row) => {
    const y = top + row * rowHeight + rowHeight * 0.5;
    if (row) box(56, top + row * rowHeight, W - 112, 1, "grid");
    if ((model.index || {}).value != null) text(String(row + 1), 56, y, { size: 14, family: "mono", color: "muted" });
    const size = fit(shortName(model), 300, 22, 600, "display");
    text(shortName(model), 92, y, { size, weight: 600, family: "display" });
    const facts = [model.quantization, VERDICT_LABELS[model.verdict]].filter(Boolean).join(" · ");
    if (facts) text(facts, 92, y + 20, { size: 12, family: "mono", color: "muted" });
    const value = (model.index || {}).value;
    text(value == null ? "–" : value.toFixed(1), indexX, y,
      { size: 30, weight: 700, family: "display", align: "right" });
    box(barStart, y - 10, barEnd - barStart, 10, "grid", 5);
    if (value != null) box(barStart, y - 10, (barEnd - barStart) * Math.max(0.015, value / best), 10, "a", 5);
    columns.forEach(([, read, format], column) => {
      const measure = read(model);
      text(measure == null ? "–" : format(measure), firstX + column * gap, y,
        { size: 17, family: "mono", color: measure == null ? "muted" : "ink", align: "right" });
    });
  });
  text(`${list.length} models${when ? " · " + when : ""}`, W - 56, H - 28,
    { size: 13, family: "mono", color: "muted", align: "right" });
}

function sustainSeries(model) {
  return Object.keys(model.speed || {}).filter(key => key.startsWith("sustain."))
    .sort().map(key => (model.speed[key] || {}).value).filter(value => value != null);
}

function curve(model, x, y, width, height) {
  /* The whole point of a phone score: twenty answers back to back, and where the throughput settles. */
  const series = sustainSeries(model);
  if (series.length < 3) return;
  const top = Math.max(...series);
  const at = value => y + height - (value / top) * height;
  const knee = (model.speed.tokens_to_knee || {}).value;
  text(`${series.length} answers back to back`, x, y - 14, { size: 13, family: "mono", color: "muted" });
  if (knee != null) {
    text(`slows down after ${knee >= 1024 ? (knee / 1024).toFixed(knee % 1024 ? 1 : 0) + "k" : knee} tokens`,
      x + width, y - 14, { size: 13, family: "mono", color: "muted", align: "right" });
  }
  box(x, y + height, width, 1, "grid");
  const point = index => [x + (index * width) / (series.length - 1), at(series[index])];
  context.beginPath();
  context.moveTo(x * S, (y + height) * S);
  series.forEach((value, index) => context.lineTo(point(index)[0] * S, point(index)[1] * S));
  context.lineTo((x + width) * S, (y + height) * S);
  context.closePath();
  context.fillStyle = PALETTE[state.theme].grid;
  context.fill();
  context.strokeStyle = PALETTE[state.theme].a;
  context.lineWidth = 3 * S;
  context.lineJoin = "round";
  context.beginPath();
  series.forEach((value, index) => {
    const [px, py] = point(index);
    if (index) context.lineTo(px * S, py * S); else context.moveTo(px * S, py * S);
  });
  context.stroke();
}

function drawOne(model) {
  /* One model on its own: what it scored, question by question, and what it cost the device to score it. */
  const when = chrome([model]);
  const size = fit(shortName(model), W - 112, 46, 700, "display");
  text(shortName(model), 56, 148, { size, weight: 700, family: "display" });
  text([model.engine, model.quantization, model.context ? Math.round(model.context / 1024) + "k ctx" : null,
        VERDICT_LABELS[model.verdict], (model.stack || {}).hostLabel].filter(Boolean).join(" · "),
    56, 176, { size: 15, family: "mono", color: "muted" });
  const value = model.index && model.index.value != null ? model.index.value.toFixed(1) : "–";
  const width = text(value, 56, 244, { size: 64, weight: 700, family: "display" });
  const spread = half(model.index);
  text("quality index" + (spread != null ? `  ±${spread.toFixed(1)}` : ""), 56 + width + 18, 244,
    { size: 16, family: "mono", color: "muted" });
  box(56, 272, W - 112, 1, "grid");
  const tasks = view.indexTasks.filter(task => model.tasks[task]);
  const span = (W - 112) / Math.max(1, tasks.length);
  tasks.forEach((task, column) => {
    const x = 56 + column * span;
    const entry = model.tasks[task];
    text(view.taskShort[task] || task, x, 308, { size: 14, family: "mono", color: "muted" });
    text(entry.value.toFixed(1), x, 350, { size: 32, weight: 700, family: "display" });
    box(x, 368, span - 36, 9, "grid", 5);
    box(x, 368, (span - 36) * Math.max(0, Math.min(1, entry.value / 100)), 9, "a", 5);
    if (entry.truncated >= 25) {
      text(`${Math.round(entry.truncated)}% cut off`, x, 394, { size: 12, family: "mono", color: "muted" });
    }
  });
  box(56, 414, W - 112, 1, "grid");
  const columns = measures([model]);
  const cell = (W - 112) / Math.max(1, columns.length);
  columns.forEach(([name, read, format], column) => {
    const x = 56 + column * cell;
    text(format(read(model)), x, 466, { size: 32, weight: 700, family: "display" });
    text(name, x, 490, { size: 13, family: "mono", color: "muted" });
  });
  curve(model, 56, 530, W - 112, 86);
  text(when, W - 56, H - 28, { size: 13, family: "mono", color: "muted", align: "right" });
}

function draw() {
  const list = chosen();
  context.fillStyle = PALETTE[state.theme].page;
  context.fillRect(0, 0, canvas.width, canvas.height);
  if (!list.length) {
    text("No finished run to show.", 56, 100, { size: 20, family: "display" });
    return;
  }
  if (list.length === 1) return drawOne(list[0]);
  if (list.length > 2) return drawMany(list);
  const left = list[0], right = list[1];
  text("mbench", 56, 62, { size: 24, weight: 700, family: "display" });
  const stack = left.stack && left.stack.gpu ? left.stack.gpu.replace("NVIDIA ", "") : "one GPU";
  text(`suite ${DATA.suite || "full"} · ${state.effort} effort · ${stack}`, W - 56, 62,
    { size: 14, family: "mono", color: "muted", align: "right" });
  box(56, 84, W - 112, 1, "grid");
  header(left, 56, "left", "a");
  header(right, W / 2 + 20, "right", "b");
  box(56, 240, W - 112, 1, "grid");
  const end = rows(left, right);
  box(56, end + 14, W - 112, 1, "grid");
  strip(left, right, end + 26);
  text("guitaripod.github.io/mbench   ·   grey bars: the two 95% intervals overlap", 56, H - 28,
    { size: 13, family: "mono", color: "muted" });
  const when = left.run.finished ? new Date(Math.max(left.run.finished, right.run.finished) * 1000)
    .toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  text(`same questions, same server settings${when ? " · " + when : ""}`, W - 56, H - 28,
    { size: 13, family: "mono", color: "muted", align: "right" });
}

function option(value, label, selected) {
  const node = document.createElement("option");
  node.value = value;
  node.textContent = label;
  node.selected = selected;
  return node;
}

function fill(id, options, value) {
  const select = document.getElementById(id);
  select.replaceChildren(...options.map(([key, label]) => option(key, label, String(key) === String(value))));
  return select;
}

function settle() {
  /* Keeps the settings answerable after any change: a class that no longer has models, a mode the class cannot fill,
     and models named at another effort all resolve to the nearest thing that can actually be drawn. */
  const efforts = view.efforts || [];
  if (!efforts.includes(state.effort)) state.effort = efforts[0];
  const here = classes();
  if (!here.includes(state.klass)) state.klass = here[0];
  const list = pool();
  if (!MODES.includes(state.mode)) state.mode = "two";
  while (list.length < NEEDS[state.mode]) state.mode = MODES[MODES.indexOf(state.mode) + 1] || "one";
  state.models = chosen().map(model => model.id);
}

function fillPicks(list) {
  /* A ranking is a set, not a length: the chips say which models are in the card, so any one of them can be dropped
     without disturbing the rest. */
  const picks = document.getElementById("picks");
  picks.hidden = state.mode !== "many";
  if (picks.hidden) return;
  picks.replaceChildren(...list.map(model => {
    const inside = state.models.includes(model.id);
    const chip = document.createElement("button");
    chip.type = "button";
    chip.textContent = shortName(model);
    chip.setAttribute("aria-pressed", inside ? "true" : "false");
    chip.disabled = inside && state.models.length <= NEEDS.many;
    chip.title = inside ? (chip.disabled ? `A ranking shows at least ${NEEDS.many} models` : "Leave it out")
      : "Put it back";
    chip.addEventListener("click", () => {
      state.models = inside ? state.models.filter(id => id !== model.id)
        : list.filter(entry => state.models.includes(entry.id) || entry === model).map(entry => entry.id);
      render();
    });
    return chip;
  }));
}

function fillControls() {
  fill("effort", (view.efforts || []).map(effort => [effort, effort]), state.effort);
  const here = classes();
  document.getElementById("where-label").hidden = here.length < 2;
  fill("where", here.map(name => [name, CLASS_LABELS[name] || name]), state.klass);
  const list = pool();
  for (const option of document.getElementById("show").options) {
    option.disabled = list.length < NEEDS[option.value];
  }
  document.getElementById("show").value = state.mode;
  const names = list.map(model => [model.id, shortName(model)]);
  const counts = [];
  for (let many = NEEDS.many; many <= list.length; many += 1) counts.push([many, `Top ${many}`]);
  if (counts.length) counts[counts.length - 1][1] = `All ${list.length}`;
  const topN = state.models.length >= NEEDS.many
    && state.models.every((id, index) => (list[index] || {}).id === id);
  if (!topN) counts.unshift(["custom", "Custom"]);
  document.getElementById("count-label").hidden = state.mode !== "many";
  fill("count", counts, topN ? state.models.length : "custom");
  fillPicks(list);
  for (const [id, index] of [["left", 0], ["right", 1]]) {
    document.getElementById(`${id}-label`).hidden = state.mode !== "two";
    fill(id, names, state.models[index]);
  }
  document.getElementById("only-label").hidden = state.mode !== "one";
  fill("only", names, state.models[0]);
  document.getElementById("theme").value = state.theme;
}

function newest() {
  /* The card is the page's own og:image, so with nothing asked for it shows the most recent work — and a comparison
     needs two models measured the same way, so an effort and class holding only one is not the answer. */
  let best = null;
  for (const effort of view.efforts || []) {
    const groups = {};
    for (const model of view.rankings[effort] || []) (groups[classOf(model)] ||= []).push(model);
    for (const [klass, group] of Object.entries(groups)) {
      if (group.length < 2) continue;
      const when = Math.max(...group.map(model => (model.run || {}).finished || 0));
      if (!best || when > best.when) best = { effort, klass, when };
    }
  }
  return best;
}

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const start = newest() || { effort: (view.efforts || [])[0], klass: classes()[0] };
  state.effort = params.get("effort") || start.effort;
  state.models = (params.get("m") || [params.get("a"), params.get("b")].filter(Boolean).join(","))
    .split(",").map(id => id.trim()).filter(Boolean);
  const first = (view.rankings[state.effort] || []).find(model => model.id === state.models[0]);
  state.klass = params.get("class") || (first ? classOf(first) : start.klass);
  state.mode = params.get("show") || (params.get("m") ? (state.models.length === 1 ? "one"
    : state.models.length === 2 ? "two" : "many") : "two");
  if (params.get("theme")) state.theme = params.get("theme");
}

function writeHash() {
  history.replaceState(null, "", "#" + new URLSearchParams({
    effort: state.effort || "", class: state.klass || "", show: state.mode,
    m: state.models.join(","), theme: state.theme,
  }).toString());
}

const HINTS = {
  one: "One model, question by question, and what it cost the device that ran it.",
  two: "A difference smaller than the two 95% intervals allow is drawn in grey and marked \"tied\" — this run can't "
    + "tell those two apart. <code>mbench compare</code> answers the same question question by question, which is a "
    + "sharper test.",
  many: "The ranking at these settings, with what each model settles at beside it.",
};
const TITLES = { one: "Model card", two: "Comparison card", many: "Ranked card" };

function render() {
  settle();
  fillControls();
  writeHash();
  draw();
  document.getElementById("title").textContent = TITLES[state.mode];
  document.getElementById("hint").innerHTML = HINTS[state.mode]
    + ' <span class="dim">1200 × 675 at 2×, the size X and Slack want.</span>';
}

function onChange(id, apply) {
  document.getElementById(id).addEventListener("change", event => {
    apply(event.target.value);
    render();
  });
}

onChange("effort", value => { state.effort = value; });
onChange("where", value => { state.klass = value; });
onChange("theme", value => { state.theme = value; });
onChange("show", value => { state.mode = value; });
onChange("count", value => {
  if (value !== "custom") state.models = pool().slice(0, Number(value)).map(model => model.id);
});
onChange("only", value => { state.models = [value]; });
onChange("left", value => { state.models = [value, state.models.find(id => id !== value)].filter(Boolean); });
onChange("right", value => { state.models = [state.models.find(id => id !== value), value].filter(Boolean); });

document.getElementById("download").addEventListener("click", () => {
  canvas.toBlob(blob => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    const list = chosen();
    link.download = "mbench-" + (list.length === 1 ? list[0].id
      : list.length === 2 ? `${list[0].id}-vs-${list[1].id}` : `${state.effort}-top${list.length}`) + ".png";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  }, "image/png");
});

window.addEventListener("hashchange", () => {
  readHash();
  render();
});

if (new URLSearchParams(location.search).get("bare") === "1") document.body.classList.add("bare");
readHash();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
</script>
</body>
</html>
